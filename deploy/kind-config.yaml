# kind cluster config — single-node, ports 80/443 mapped to host so NGINX Ingress
# is reachable from outside the VM.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kaamnow

# Single control-plane node (low resources). Mount disk for MongoDB persistence.
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
