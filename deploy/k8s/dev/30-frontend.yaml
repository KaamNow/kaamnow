apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kaamnow-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kaamnow-frontend:latest  # replaced by deploy-dev.sh
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kaamnow-dev
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
