apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kaamnow-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kaamnow-backend:latest   # replaced by deploy-dev.sh with real tag
          imagePullPolicy: Never          # use local kind-loaded image
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /api/stats
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/stats
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kaamnow-dev
spec:
  selector:
    app: backend
  ports:
    - port: 8001
      targetPort: 8001
