# Backend Secret + ConfigMap + Deployment + Service
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: kaamnow
type: Opaque
stringData:
  # MongoDB Atlas — shared across dev and prod (same data)
  MONGO_URL: "mongodb+srv://KaamNowAdmin:KaamNowAdmin%40123@cluster0.dduibsm.mongodb.net/?appName=Cluster0"
  DB_NAME: "kaamnow_db"
  # JWT / admin — deploy script overwrites these on first deploy
  JWT_SECRET: "REPLACE_ME_WITH_64_CHAR_HEX_FROM_DEPLOY_SCRIPT"
  ADMIN_EMAIL: "admin@kaamnow.com"
  ADMIN_PASSWORD: "ChangeMe-After-First-Deploy"
  # WhatsApp / Gupshup
  GUPSHUP_API_URL: "https://api.gupshup.io/wa/api/v1/msg"
  GUPSHUP_API_KEY: "sk_376ba99b7f584e659b35f7cbf92d4286"
  GUPSHUP_SOURCE: "917834811114"
  GUPSHUP_APP_ID: "KaamNow"
  GUPSHUP_VERIFY_TOKEN: "my_secure_token_123"
  # Cloudinary — profile photo storage
  CLOUDINARY_CLOUD_NAME: "dztrzwvee"
  CLOUDINARY_API_KEY: "455385769148981"
  CLOUDINARY_API_SECRET: "KdYmM68W8Z3TlsGauG_iQTtdwfE"
  GUPSHUP_TEMPLATE_URL: "https://api.gupshup.io/wa/api/v1/template/msg"
  GUPSHUP_TEMPLATE_NAMESPACE: "fc27d30f_a1e9_e84c_cd55_0de6ee10b598"
  SHOW_OTP_IN_RESPONSE: "false"
  GUPSHUP_SANDBOX_MODE: "true"
  ADMIN_BOOTSTRAP_SECRET: "REPLACE_ME_WITH_STRONG_SECRET"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kaamnow
data:
  # MONGO_URL and DB_NAME are in the Secret (contain credentials)
  CORS_ORIGINS: "https://kaamnow.com,https://www.kaamnow.com"
  FEATURE_WHATSAPP_NOTIFICATIONS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kaamnow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kaamnow/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/stats
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/stats
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/static/uploads
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: kaamnow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kaamnow
spec:
  selector:
    app: backend
  ports:
    - port: 8001
      targetPort: 8001
      name: http
