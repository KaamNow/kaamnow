name: CI — Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, ui-ux]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black isort flake8

      - name: black
        run: black --check backend/ --line-length 100 --target-version py311

      - name: isort
        run: isort --check-only backend/ --profile black

      # flake8 re-enabled in Phase 1 after legacy code is replaced
      # Current codebase has F401/F841/F541 in files being rewritten
