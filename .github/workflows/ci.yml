name: CI — Tests & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, ui-ux]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
          FEATURE_VOICE: "false"
          SHOW_OTP_IN_RESPONSE: "true"
        run: |
          pytest tests/test_whatsapp.py -v --tb=short
          # test_current_flows.py + test_phase_2_* + test_phases_4_to_9 + test_auth_phone_first
          # are being rewritten in Phase 1 — skipped in CI until then

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black isort flake8

      - name: black
        run: black --check backend/ --line-length 100

      - name: isort
        run: isort --check-only backend/

      - name: flake8
        run: flake8 backend/ --max-line-length=100 --exclude=__pycache__,migrations
