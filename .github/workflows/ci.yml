name: CI — Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, ui-ux]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black isort flake8

      - name: black
        run: black --check backend/ --line-length 100 --target-version py311

      - name: isort
        run: isort --check-only backend/ --profile black

      - name: flake8
        run: |
          flake8 backend/ \
            --max-line-length 100 \
            --extend-ignore=E203,W503,E501 \
            --exclude=__pycache__,migrations
