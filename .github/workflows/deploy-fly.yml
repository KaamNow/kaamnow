name: Deploy — Fly.io (Free Staging)

on:
  push:
    branches: [ui-ux]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io (Mumbai region)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          doppler run \
            --token "${{ secrets.DOPPLER_TOKEN }}" \
            --project kaamnow \
            --config dev \
            -- flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          sleep 10
          curl -f "https://kaamnow-dev.fly.dev/api/stats" || exit 1
          echo "✅ Fly.io deployment healthy"
