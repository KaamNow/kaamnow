name: Release — Build & Deploy Prod

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
        run: pytest tests/ -v

  build-android:
    name: EAS — Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - run: npm install -g eas-cli
      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --output ../kaamnow-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}
          path: kaamnow-${{ github.ref_name }}.apk
          retention-days: 30

  deploy-backend-prod:
    name: Deploy backend → Fly.io prod
    runs-on: ubuntu-latest
    needs: [test]
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" \
            'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share-keyrings/doppler-archive-keyring.gpg] \
            https://packages.doppler.com/public/cli/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update -q && sudo apt-get install -q doppler

      - name: Sync Doppler prod secrets → Fly.io prod
        run: |
          doppler secrets download \
            --token "${{ secrets.DOPPLER_TOKEN_PROD }}" \
            --project kaamnow \
            --config production \
            --no-file \
            --format env | flyctl secrets import --app kaamnow-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy prod
        run: flyctl deploy --remote-only --app kaamnow-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-admin-vercel:
    name: Deploy admin → Vercel (free)
    runs-on: ubuntu-latest
    needs: [test]
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  create-release:
    name: Create GitHub Release with APK
    runs-on: ubuntu-latest
    needs: [build-android, deploy-backend-prod, deploy-admin-vercel]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KaamNow ${{ github.ref_name }}"
          body: |
            ## KaamNow ${{ github.ref_name }}

            ### Install on Android
            Download `kaamnow-${{ github.ref_name }}.apk` and install.

            ### What's new
            See commit history for full changelog.
          files: kaamnow-${{ github.ref_name }}.apk
