name: Release — Build & Deploy Prod

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
        run: pytest tests/ -v

  build-android:
    name: EAS — Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --output ../kaamnow-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}
          path: kaamnow-${{ github.ref_name }}.apk
          retention-days: 30

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [test, build-android]
    environment: production  # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" \
            'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] \
            https://packages.doppler.com/public/cli/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install doppler

      - name: Build & deploy production images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/kaamnow
            git fetch --tags
            git checkout ${{ github.ref_name }}
            export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_PROD }}
            sudo bash deploy/deploy.sh ${{ github.sha }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KaamNow ${{ github.ref_name }}"
          body: |
            ## What's Changed
            See commit history for full changes.

            ## Install
            Download the APK below and install on Android.
          files: kaamnow-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
