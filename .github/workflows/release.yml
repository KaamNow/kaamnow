name: Release — Prod (EC2, isolated cluster)

on:
  push:
    tags: ["v*"]

jobs:
  build-android:
    name: EAS — Android APK
    runs-on: ubuntu-latest
    # Test gate added back in Phase 1 when new tests are written
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - run: npm install -g eas-cli
      - name: Build APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --output ../kaamnow-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}
          path: kaamnow-${{ github.ref_name }}.apk
          retention-days: 30

  deploy-prod:
    name: SSH → Prod EC2 → deploy.sh (~2-3 min)
    runs-on: ubuntu-latest
    needs: [build-android]
    environment: production   # manual approval gate in GitHub

    steps:
      - name: Deploy via SSH to PROD EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          command_timeout: "5m"
          script: |
            cd /home/ubuntu/kaamnow
            git fetch --tags
            git checkout ${{ github.ref_name }}
            export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_PROD }}"
            sudo -E bash deploy/deploy.sh ${{ github.sha }}

      - name: Prod health check
        run: |
          sleep 10
          curl -f "https://kaamnow.com/api/stats" --max-time 20 || true
          echo "✅ Prod deployed"

  release:
    name: Create GitHub Release with APK
    runs-on: ubuntu-latest
    needs: [build-android, deploy-prod]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kaamnow-android-${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          name: "KaamNow ${{ github.ref_name }}"
          files: kaamnow-${{ github.ref_name }}.apk
          body: |
            ## KaamNow ${{ github.ref_name }}
            Download APK below to install on Android.
