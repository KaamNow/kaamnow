name: Deploy — Dev (Render)

on:
  push:
    branches: [main, ui-ux]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
          FEATURE_VOICE: "false"
          SHOW_OTP_IN_RESPONSE: "true"
        run: pytest tests/ -v --tb=short

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          deploy_id = d.get('deploy', {}).get('id', 'unknown')
          print(f'✅ Deploy triggered — ID: {deploy_id}')
          "

      - name: Wait and health check
        run: |
          echo "Waiting 60s for Render to build..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.DEV_API_URL }}/api/stats" --max-time 30)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Dev API is live"
          else
            echo "⚠️  Health check returned $STATUS — deploy may still be building"
          fi

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Deployed to Render dev** — \`${context.sha.slice(0,7)}\`\n🌏 ${{ secrets.DEV_API_URL }}/api/stats`
            })
