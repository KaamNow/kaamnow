name: Deploy — Dev (EC2, isolated cluster)

on:
  push:
    branches: [main, ui-ux]

concurrency:
  group: deploy-dev
  cancel-in-progress: true  # if 2 pushes queued, cancel older one

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
          FEATURE_VOICE: "false"
          SHOW_OTP_IN_RESPONSE: "true"
        run: pytest tests/ -v --tb=short

  deploy:
    name: SSH → EC2 → deploy-dev.sh (~2-3 min)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          command_timeout: "5m"
          script: |
            cd /home/ubuntu/kaamnow
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN }}"
            sudo -E bash deploy/deploy-dev.sh ${{ github.sha }}

      - name: Health check
        run: |
          sleep 10
          curl -f "${{ secrets.DEV_API_URL }}/api/stats" \
            --max-time 15 --retry 3 --retry-delay 5 || true
          echo "✅ Done"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                '✅ **Deployed to dev EC2**',
                '`' + context.sha.slice(0,7) + '`',
                '',
                '🌏 `${{ secrets.DEV_API_URL }}/api/stats`',
                '🏗️ Cluster: `kaamnow-dev` (isolated)'
              ].join('\n')
            })
