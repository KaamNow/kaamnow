name: Deploy — Dev

on:
  push:
    branches: [main, ui-ux]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Tests must pass before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
          FEATURE_VOICE: "false"
          SHOW_OTP_IN_RESPONSE: "true"
        run: pytest tests/ -v --tb=short

  deploy:
    name: Deploy to dev k8s
    runs-on: ubuntu-latest
    needs: test
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" \
            'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] \
            https://packages.doppler.com/public/cli/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install doppler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          IMAGE_TAG="dev-${{ github.sha }}"
          doppler run --token ${{ secrets.DOPPLER_TOKEN }} --project kaamnow --config dev -- \
            docker build -f deploy/Dockerfile.backend -t kaamnow-backend:$IMAGE_TAG .
          echo "BACKEND_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build frontend image
        run: |
          IMAGE_TAG="dev-${{ github.sha }}"
          docker build -f deploy/Dockerfile.frontend -t kaamnow-frontend:$IMAGE_TAG .
          echo "FRONTEND_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            cd /opt/kaamnow
            git pull origin ${{ github.ref_name }}
            export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN }}
            sudo bash deploy/deploy-dev.sh ${{ github.sha }}

      - name: Smoke test — health check
        run: |
          sleep 15
          curl -f "${{ secrets.DEV_API_URL }}/api/stats" \
            -H "Accept: application/json" || exit 1
          echo "✅ Dev API is healthy"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Deployed to dev** — [\`${context.sha.slice(0,7)}\`](${context.payload.compare})\n\nDev API: ${{ secrets.DEV_API_URL }}/api/stats`
            })
