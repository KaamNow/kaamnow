name: Deploy — Dev (Fly.io)

on:
  push:
    branches: [main, ui-ux]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Tests must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_DEV }}
          DB_NAME: kaamnow_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET_CI }}
          FEATURE_AI: "false"
          FEATURE_CHAT: "false"
          FEATURE_PAYMENTS: "false"
          FEATURE_VOICE: "false"
          SHOW_OTP_IN_RESPONSE: "true"
        run: pytest tests/ -v --tb=short

  deploy:
    name: Deploy to Fly.io (Mumbai)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" \
            'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] \
            https://packages.doppler.com/public/cli/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update -q && sudo apt-get install -q doppler

      - name: Sync Doppler secrets → Fly.io
        run: |
          # Pull secrets from Doppler dev config → push to Fly.io
          doppler secrets download \
            --token "${{ secrets.DOPPLER_TOKEN }}" \
            --project kaamnow \
            --config dev \
            --no-file \
            --format env | flyctl secrets import --app kaamnow-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app kaamnow-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          sleep 15
          curl -f "https://kaamnow-dev.fly.dev/api/stats" || exit 1
          echo "✅ Deployed and healthy"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Deployed to Fly.io dev** — \`${context.sha.slice(0,7)}\`\n🌏 https://kaamnow-dev.fly.dev/api/stats`
            })
