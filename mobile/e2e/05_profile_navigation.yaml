appId: com.kaamnow.app
---
# Flow 5: Profile screen — all buttons work
- launchApp
- tapOn: "My Profile"

# Wallet
- tapOn: "My Wallet"
- assertVisible: "Your credits"
- tapOn:
    label: "Back"

# FAQ
- tapOn: "Help & FAQ"
- assertVisible: "Search questions"
- tapOn:
    label: "Back"

# Terms
- tapOn: "Terms of Service"
- assertVisible: "Version"
- tapOn:
    label: "Back"

# Privacy
- tapOn: "Privacy Policy"
- assertVisible: "Version"
- tapOn:
    label: "Back"

# Emergency contact
- tapOn: "Emergency Contact"
- assertVisible: "Contact name"
- tapOn:
    label: "Back"

# Language toggle — tap EN pill → should change to हिं
- tapOn: "EN"
- assertVisible: "हिं"
