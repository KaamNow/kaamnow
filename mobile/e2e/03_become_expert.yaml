appId: com.kaamnow.app
---
# Flow 3: Become a Local Expert
- launchApp

# Navigate to Profile tab
- tapOn: "My Profile"
- assertVisible: "Become a Local Expert"

# Tap become expert card
- tapOn: "Become a Local Expert"
- assertVisible: "What are your skills"

# Step 1 — select skills
- tapOn: "plumber"
- tapOn: "electrician"
- tapOn: "Next"

# Step 2 — rate and pincode
- assertVisible: "daily rate"
- inputText: "600"
- tapOn: "800001"
- tapOn: "Next"

# Step 3 — bio (optional)
- assertVisible: "About you"
- tapOn: "Start Working"

# Should see worker profile now
- assertVisible: "My Expert Profile"
