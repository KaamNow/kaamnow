appId: com.kaamnow.app
---
# Flow 2: Post a job (logged-in user)
- launchApp

# Tap Post a Job tab
- tapOn: "Post a Job"
- assertVisible: "Kya kaam chahiye"

# Step 1 — pick category
- tapOn: "Cleaning"
- assertVisible: "Kaunsi skill chahiye"

# Step 2 — pick skill
- tapOn: "House cleaning"

# Step 3 — details
- assertVisible: "Kaam ki jankari"
- clearText:
    id: "daily-rate-input"
- inputText: "400"
- tapOn: "Normal"

# Set pincode
- tapOn:
    id: "pincode-input"
- inputText: "800001"
- waitForAnimationToEnd
- assertVisible: "Patna"

# Step 4 — review and submit
- tapOn: "Next"
- assertVisible: "Post Job"
- tapOn: "Post Job"

# Success
- assertVisible: "Job posted"
