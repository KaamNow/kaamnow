appId: com.kaamnow.app
---
# Flow 4: Worker finds job and applies
- launchApp

# Go to Find Work tab
- tapOn: "Find Work"
- assertVisible: "Jobs Near You"

# Tap first job card
- tapOn:
    index: 0
    text: "Apply"

# Confirm applied
- assertVisible: "Applied"

# Navigate to Activity tab to see applications
- tapOn: "My Activity"
- tapOn: "My Applications"
- assertVisible: "Pending"
