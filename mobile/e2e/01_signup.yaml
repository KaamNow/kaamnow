appId: com.kaamnow.app
---
# Flow 1: New user signup
- launchApp
- assertVisible: "KaamNow"

# Dismiss onboarding walkthrough if shown
- optional:
    - tapOn: "Skip"

# Tap Login tab (guest mode)
- tapOn: "Login"
- assertVisible: "KaamNow"

# Enter phone
- tapOn:
    id: "phone-input"
- inputText: "9000000099"
- tapOn: "Code bhejo"
- assertVisible: "Code dalein"

# Enter OTP (dev mode returns OTP in response — check API or use 000000 test code)
- inputText: "000000"
- tapOn: "OTP confirm karo"

# Step 3 — name entry
- assertVisible: "Finish signing up"
- tapOn:
    id: "name-input"
- inputText: "Test User E2E"
- tapOn: "Create account"

# Should land on Home tab
- assertVisible: "KaamNow"
- assertVisible: "Post a Job"
